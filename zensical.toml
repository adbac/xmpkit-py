[project]
site_url = "https://adbac.github.io/xmpkit-py"
site_name = "xmpkit-py · Documentation"

site_description = "xmpkit-py documentation - Python bindings for xmpkit (Rust)"

site_author = "Adrien Bachelart"

copyright = """
Copyright &copy; 2026 Adrien Bachelart
"""

site_dir = "site/"
docs_dir = "docs/"

repo_url = "https://github.com/adbac/xmpkit-py"
repo_name = "xmpkit-py"
edit_uri = "edit/main/docs/"

nav = [
    { "Introduction" = "index.md" },
    { "Installation" = "installation.md" },
    { "API Reference" = "api-reference.md" },
]

extra_css = ["assets/css/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    # "header.autohide",
    # "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    # "navigation.instant.progress",
    "navigation.path",
    # "navigation.prune",
    "navigation.sections",
    # "navigation.tabs",
    # "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
    # "toc.integrate",
]

[project.theme.icon]
logo = "lucide/file-image"

[project.theme.font]
# text = "Inter"
code = "Google Sans Code"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/adbac/xmpkit-py"


[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["python"]

[project.plugins.mkdocstrings.handlers.python.options]
find_stubs_package = true
backlinks = "tree"
docstring_options = { "ignore_init_summary" = true }
docstring_section_style = "list"
docstring_style = "google"
# heading_level = 1
inherited_members = true
members_order = "source"
line_length = 45
show_source = false
filters = []
merge_init_into_class = true
separate_signature = true
show_root_heading = true
show_root_full_path = true
show_signature_annotations = true
show_signature_type_parameters = true
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true
relative_crossrefs = true
scoped_crossrefs = true
# parameter_headings = true
summary = true
unwrap_annotated = true
# show_if_no_docstring = true
# show_inheritance_diagram = true

[project.markdown_extensions.zensical.extensions.autorefs]
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
default_lang = "python"
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]